spring.application.name=angiday-dev

# Hibernate Configuration
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.hbm2ddl.auto=update
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security.web=DEBUG

# Database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/angiday_dev}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:123456}

# Jwt configurations
jwt.header=Authorization
jwt.prefix=Bearer
jwt.expiration=120
jwt.secret=${JWT_SECRET:15b3dac275fd604c1e714566fd4eda15d9688e2fc5c300cfaa0522381debb84b}

# SOAP SMS Configuration
soap.endpoint=${SOAP_ENDPOINT}
soap.user=${SOAP_USER}
soap.password=${SOAP_PASSWORD}
soap.cpCode=${SOAP_CPCODE}
soap.brandName=${SOAP_BRANDNAME}

# Redis configuration
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.time-to-live-otp=${REDIS_TIME_TO_LIVE_OTP:60}
